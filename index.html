========================= */

.link{

   NODE
========================= */

/* =========================================================
   НАСТОЯЩАЯ ДЕРЕВООБРАЗНАЯ СТРУКТУРА
========================================================= */

class TreeNode{

    constructor({
        id,
        text,
        type,
        parent=null,
        children=[]
    }){

        this.id=id;
        this.text=text;
        this.type=type;
        this.parent=parent;

        this.children=children;

        this.expanded=false;

        this.x=0;
        this.y=0;

        this.width=0;
        this.height=0;

        this.subtreeHeight=0;
    }
}


const root =
    new TreeNode({
        id:"root",
        text:"ЖИЗНЬ",
        type:"life"
    });


const directories =
    Object.keys(DATA).map(
        (name,di)=>{

            const directory =
                new TreeNode({
                    id:`directory-${di}`,
                    text:name,
                    type:"directory",
                    parent:root
                });


            directory.sourceName=name;


            directory.children =
                DATA[name].map(
                    (task,ti)=>{

                        const taskNode =
                            new TreeNode({
                                id:`task-${di}-${ti}`,
                                text:task[0],
                                type:"task",
                                parent:directory
                            });


                        taskNode.source=
                            task;


                        taskNode.children =
                            task[1].map(
                                (step,si)=>
                                    new TreeNode({
                                        id:`step-${di}-${ti}-${si}`,
                                        text:step,
                                        type:"step",
                                        parent:taskNode
                                    })
                            );


                        return taskNode;
                    }
                );


            return directory;
        }
    );


root.children=directories;

/* =========================================================
   РАЗМЕРЫ УЗЛОВ
========================================================= */

const NODE_GAP=42;

const LEVEL_GAP=190;


/*
   Реальная высота поддерева.

   Это главное.

   Если у одного узла раскрыто
   10 детей, он получает высоту
   всех этих детей.

   Поэтому соседний узел
   физически не может попасть
   внутрь его пространства.
*/

function calculateSize(node){

    const sizes={
        life:[180,180],
        directory:[210,76],
        task:[245,78],
        step:[270,76]
    };


    node.width =
        sizes[node.type][0];

    node.height =
        sizes[node.type][1];


    const visibleChildren =
        node.expanded
            ? node.children
            : [];


    if(
        visibleChildren.length===0
    ){

        node.subtreeHeight=
            node.height;

        return node.subtreeHeight;
    }


    let childrenHeight=0;


    visibleChildren.forEach(
        child=>{

            childrenHeight +=
                calculateSize(child);

        }
    );


    childrenHeight +=
        NODE_GAP*
        (visibleChildren.length-1);


    node.subtreeHeight =
        Math.max(
            node.height,
            childrenHeight
        );


    return node.subtreeHeight;
}


/* =========================================================
   РАЗМЕЩЕНИЕ
========================================================= */


/*
   XMind-подобный принцип:

   ROOT
     |
     +-- ветви сверху вниз

   Каждая ветвь получает
   собственную вертикальную полосу.

   Если ветвь раскрывается,
   её полоса увеличивается.

   Остальные ветви автоматически
   сдвигаются.
*/

function layoutChildren(
    node,
    direction,
    centerY
){

    const children =
        node.expanded
            ? node.children
            : [];


    if(!children.length){
        return;
    }


    const totalHeight =
        children.reduce(
            (sum,child)=>
                sum+
                child.subtreeHeight,
            0
        )
        +
        NODE_GAP*
        (children.length-1);


    let cursor =
        centerY-
        totalHeight/2;


    children.forEach(
        child=>{

            const childCenter =
                cursor+
                child.subtreeHeight/2;


            child.x =
                node.x+
                direction*
                (
                    node.width/2+
                    LEVEL_GAP+
                    child.width/2
                );


            child.y =
                childCenter;


            layoutChildren(
                child,
                direction,
                childCenter
            );


            cursor +=
                child.subtreeHeight+
                NODE_GAP;
        }
    );
}


/* =========================================================
   ROOT LAYOUT
========================================================= */

function layout(){

    calculateSize(root);


    root.x =
        WORLD_CENTER_X;

    root.y =
        WORLD_CENTER_Y;


    const children =
        root.expanded
            ? root.children
            : [];


    if(!children.length){
        return;
    }


    /*
       Половина директорий слева,
       половина справа.

       Это делает карту похожей
       на классический XMind.
    */

    const left =
        children.slice(
            0,
            Math.ceil(
                children.length/2
            )
        );


    const right =
        children.slice(
            Math.ceil(
                children.length/2
            )
        );


    /*
       Для симметрии используем
       отдельную вертикальную раскладку.
    */

    function layoutSide(
        list,
        direction
    ){

        if(!list.length){
            return;
        }


        const total =
            list.reduce(
                (sum,n)=>
                    sum+n.subtreeHeight,
                0
            )
            +
            NODE_GAP*
            (list.length-1);


        let cursor =
            WORLD_CENTER_Y-
            total/2;


        list.forEach(
            node=>{

                const cy =
                    cursor+
                    node.subtreeHeight/2;


                node.x =
                    WORLD_CENTER_X+
                    direction*
                    (
                        root.width/2+
                        LEVEL_GAP+
                        node.width/2
                    );


                node.y=cy;


                layoutChildren(
                    node,
                    direction,
                    cy
                );


                cursor +=
                    node.subtreeHeight+
                    NODE_GAP;
            }
        );
    }


    layoutSide(
        left,
        -1
    );


    layoutSide(
        right,
        1
    );
}


/* =========================================================
   SVG CONNECTIONS
========================================================= */

function clearLinks(){

    while(
        svg.firstChild
    ){
        svg.removeChild(
            svg.firstChild
        );
    }
}


function drawLine(
    parent,
    child
){

    /*
       Горизонтальная мягкая
       кривая как в mind-map.
    */

    const startX =
        parent.x+
        (
            child.x>parent.x
                ? parent.width/2
                : -parent.width/2
        );


    const endX =
        child.x+
        (
            child.x>parent.x
                ? -child.width/2
                : child.width/2
        );


    const startY =
        parent.y;

    const endY =
        child.y;


    const midX =
        (startX+endX)/2;


    const path =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path"
        );


    path.setAttribute(
        "d",
        `
        M ${startX} ${startY}
        C
        ${midX} ${startY},
        ${midX} ${endY},
        ${endX} ${endY}
        `
    );


    path.classList.add("link");


    svg.appendChild(path);
}


function drawConnections(
    node
){

    if(
        !node.expanded
    ){
        return;
    }


    node.children.forEach(
        child=>{

            drawLine(
                node,
                child
            );

            drawConnections(
                child
            );
        }
    );
}


/* =========================================================
   DOM NODE
========================================================= */

const elements =
    new Map();


function createElement(
    node
){

    let element =
        elements.get(
            node.id
        );


    if(!element){

        element =
            document.createElement(
                "div"
            );


        element.className=
            `node ${node.type}`;


        element.dataset.id=
            node.id;


        const text =
            document.createElement(
                "span"
            );


        text.textContent=
            node.text;


        element.appendChild(
            text
        );


        /*
           Плюс/минус появляется
           только если у узла есть дети.
        */

        if(
            node.children.length
        ){

            const toggle =
                document.createElement(
                    "div"
                );


            toggle.className=
                "toggle";


            element.appendChild(
                toggle
            );
        }


        element.addEventListener(
            "click",
            event=>{

                event.stopPropagation();

                toggleNode(
                    node
                );

            }
        );


        world.appendChild(
            element
        );


        elements.set(
            node.id,
            element
        );
    }


    element.querySelector(
        ".toggle"
    )?.replaceChildren(
        document.createTextNode(
            node.expanded
                ? "−"
                : "+"
        )
    );


    element.style.width=
        `${node.width}px`;


    element.style.minHeight=
        `${node.height}px`;


    element.style.left=
        `${node.x}px`;


    element.style.top=
        `${node.y}px`;


    requestAnimationFrame(
        ()=>{
            element.classList.add(
                "visible"
            );
        }
    );
}


/* =========================================================
   СИНХРОНИЗАЦИЯ DOM
========================================================= */

function collectVisible(
    node,
    result=[]
){

    result.push(node);


    if(
        node.expanded
    ){

        node.children.forEach(
            child=>
                collectVisible(
                    child,
                    result
                )
        );
    }


    return result;
}


function render(){

    layout();


    const visible =
        collectVisible(
            root
        );


    const visibleIds =
        new Set(
            visible.map(
                n=>n.id
            )
        );


    /*
       Удаляем элементы,
       которые больше не видимы.
    */

    elements.forEach(
        (element,id)=>{

            if(
                !visibleIds.has(id)
            ){

                element.classList.remove(
                    "visible"
                );


                setTimeout(
                    ()=>{

                        if(
                            !visibleIds.has(id)
                        ){

                            element.remove();

                            elements.delete(id);
                        }

                    },
                    300
                );
            }
        }
    );


    visible.forEach(
        node=>
            createElement(node)
    );


    clearLinks();


    drawConnections(
        root
    );


    hint.style.opacity =
        root.expanded
            ? "0"
            : "1";


    /*
       После раскрытия подстраиваем
       масштаб только если карта
       стала больше viewport.
    */

    requestAnimationFrame(
        ensureVisible
    );
}


/* =========================================================
   TOGGLE
========================================================= */

function toggleNode(
    node
){

    if(
        !node.children.length
    ){
        return;
    }


    node.expanded=
        !node.expanded;


    /*
       Если закрываем узел,
       закрываем всё его поддерево.

       Это поведение очень близко
       к mind-map приложениям.
    */

    if(
        !node.expanded
    ){

        collapseAll(
            node
        );
    }


    render();
}


function collapseAll(
    node
){

    node.children.forEach(
        child=>{

            child.expanded=
                false;

            collapseAll(
                child
            );

        }
    );
}


/* =========================================================
   AUTO FIT
========================================================= */

function getBounds(){

    const visible =
        collectVisible(
            root,
            []
        );


    let minX=Infinity;
    let minY=Infinity;
    let maxX=-Infinity;
    let maxY=-Infinity;


    visible.forEach(
        node=>{

            minX=
                Math.min(
                    minX,
                    node.x-node.width/2
                );


            maxX=
                Math.max(
                    maxX,
                    node.x+node.width/2
                );


            minY=
                Math.min(
                    minY,
                    node.y-node.height/2
                );


            maxY=
                Math.max(
                    maxY,
                    node.y+node.height/2
                );

        }
    );


    return {
        minX,
        minY,
        maxX,
        maxY
    };
}


/* =========================================================
   CAMERA
========================================================= */

let camera={
    x:0,
    y:0,
    scale:.65
};


function updateCamera(){

    world.style.transform=
        `
        translate(
            ${camera.x}px,
            ${camera.y}px
        )
        scale(
            ${camera.scale}
        )
        `;
}


function fitMap(){

    const bounds=
        getBounds();


    const vw=
        viewport.clientWidth;

    const vh=
        viewport.clientHeight;


    const padding=100;


    const width=
        bounds.maxX-
        bounds.minX+
        padding*2;


    const height=
        bounds.maxY-
        bounds.minY+
        padding*2;


    camera.scale=
        Math.min(
            .85,
            Math.max(
                .15,
                Math.min(
                    vw/width,
                    vh/height
                )
            )
        );


    const cx=
        (bounds.minX+
         bounds.maxX)/2;


    const cy=
        (bounds.minY+
         bounds.maxY)/2;


    camera.x=
        vw/2-
        cx*camera.scale;


    camera.y=
        vh/2-
        cy*camera.scale;


    updateCamera();
}


function ensureVisible(){

    /*
       Если карта становится шире
       viewport — уменьшаем масштаб.

       Если она помещается —
       НЕ трогаем zoom пользователя.
    */

    const bounds=
        getBounds();


    const vw=
        viewport.clientWidth;

    const vh=
        viewport.clientHeight;


    const width=
        bounds.maxX-
        bounds.minX;

    const height=
        bounds.maxY-
        bounds.minY;


    const required=
        Math.min(
            (vw-80)/width,
            (vh-80)/height
        );


    if(
        required<
        camera.scale
    ){

        camera.scale=
            Math.max(
                .15,
                required
            );


        const cx=
            (bounds.minX+
             bounds.maxX)/2;


        const cy=
            (bounds.minY+
             bounds.maxY)/2;


        camera.x=
            vw/2-
            cx*camera.scale;


        camera.y=
            vh/2-
            cy*camera.scale;


        updateCamera();
    }
}


/* =========================================================
   ZOOM
========================================================= */

function zoomAt(
    amount,
    sx,
    sy
){

    const worldX=
        (sx-camera.x)/
        camera.scale;


    const worldY=
        (sy-camera.y)/
        camera.scale;


    camera.scale=
        Math.max(
            .08,
            Math.min(
                2.5,
                camera.scale+
                amount
            )
        );


    camera.x=
        sx-
        worldX*camera.scale;


    camera.y=
        sy-
        worldY*camera.scale;


    updateCamera();
}


viewport.addEventListener(
    "wheel",
    event=>{

        event.preventDefault();


        zoomAt(
            event.deltaY<0
                ? .1
                : -.1,
            event.clientX,
            event.clientY
        );

    },
    {passive:false}
);


/* =========================================================
   PAN
========================================================= */

let dragging=false;
let dragX=0;
let dragY=0;
let startCameraX=0;
let startCameraY=0;


viewport.addEventListener(
    "mousedown",
    event=>{

        if(
            event.target.closest(".node")
        ){
            return;
        }


        dragging=true;


        viewport.classList.add(
            "dragging"
        );


        dragX=
            event.clientX;

        dragY=
            event.clientY;


        startCameraX=
            camera.x;

        startCameraY=
            camera.y;
    }
);


window.addEventListener(
    "mousemove",
    event=>{

        if(!dragging){
            return;
        }


        camera.x=
            startCameraX+
            event.clientX-
            dragX;


        camera.y=
            startCameraY+
            event.clientY-
            dragY;


        updateCamera();
    }
);


window.addEventListener(
    "mouseup",
    ()=>{
        dragging=false;

        viewport.classList.remove(
            "dragging"
        );
    }
);


/* =========================================================
   BUTTONS
========================================================= */

document
    .getElementById("plus")
    .onclick=
    ()=>{
        zoomAt(
            .15,
            viewport.clientWidth/2,
            viewport.clientHeight/2
        );
    };


document
    .getElementById("minus")
    .onclick=
    ()=>{
        zoomAt(
            -.15,
            viewport.clientWidth/2,
            viewport.clientHeight/2
        );
    };


document
    .getElementById("home")
    .onclick=
    fitMap;


/* =========================================================
   START
========================================================= */

/*
   Только ЖИЗНЬ открыта.
   Директории скрыты.
*/

root.expanded=false;


/*
   Первичная позиция.
*/

root.x=
    WORLD_CENTER_X;

root.y=
    WORLD_CENTER_Y;


render();


/*
   Центрируем ЖИЗНЬ.
*/

setTimeout(
    ()=>{
        camera.scale=.65;

        camera.x=
            viewport.clientWidth/2-
            WORLD_CENTER_X*
            camera.scale;

        camera.y=
            viewport.clientHeight/2-
            WORLD_CENTER_Y*
            camera.scale;

        updateCamera();
    },
    50
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{
        render();

        if(
            !root.expanded
        ){
            camera.x=
                viewport.clientWidth/2-
                WORLD_CENTER_X*
                camera.scale;

            camera.y=
                viewport.clientHeight/2-
                WORLD_CENTER_Y*
                camera.scale;

            updateCamera();
        }
    }
);

</script>
